version: '3.8'

services:
  # ----------------------------------------------------
  # CORE SERVICES
  # ----------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: awap_postgres
    environment:
      POSTGRES_USER: awapuser
      POSTGRES_PASSWORD: awappassword
      POSTGRES_DB: awap_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awapuser -d awap_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: awap_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------
  # AWAP-AI BACKEND
  # ----------------------------------------------------
  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: awap_api
    command: uvicorn awap.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://awapuser:awappassword@db:5432/awap_db
      - REDIS_URL=redis://redis:6379/0
      # LLM keys must be passed from host env or .env file
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: awap_celery_worker
    command: celery -A awap.core.celery_app worker --loglevel=info -E
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://awapuser:awappassword@db:5432/awap_db
      - REDIS_URL=redis://redis:6379/0
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: awap_flower
    ports:
      - "5555:5555"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A awap.core.celery_app flower --port=5555
    
  dvwa:
    image: vulnerables/web-dvwa
    container_name: awap_dvwa
    ports:
      - "4280:80"

  juice_shop:
    image: bkimminich/juice-shop
    container_name: awap_juice_shop
    ports:
      - "3000:3000"

  playground:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: awap_playground
    command: python -m awap.playground.app
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"

  dvga:
    image: dolevf/dvga
    container_name: awap_dvga
    ports:
      - "5013:5013"

  webgoat:
    image: webgoat/webgoat:latest
    container_name: awap_webgoat
    ports:
      - "8090:8080"

  bwapp:
    image: raesene/bwapp
    container_name: awap_bwapp
    ports:
      - "8091:80"

  # ----------------------------------------------------
  # AWAP-AI FRONTEND
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: awap_frontend
    # Mapping Vite default port
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
      - VITE_PROXY_TARGET=http://api:8000
      - VITE_WS_PROXY_TARGET=ws://api:8000
    depends_on:
      - api

volumes:
  postgres_data:
